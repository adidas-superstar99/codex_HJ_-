<style>
:root{
  --bg:#06070d;
  --bg-2:#0b0d16;
  --panel:#0f1320;
  --panel-2:#12182a;
  --panel-3:#171d33;
  --line:#242b45;
  --line-strong:#31395f;
  --text:#f5f7ff;
  --text-soft:#c7cbe0;
  --text-muted:#8d93b2;
  --brand:#7a4dff;
  --brand-strong:#9e7bff;
  --brand-soft:rgba(122,77,255,.16);
  --brand-glow:0 0 0 1px rgba(122,77,255,.22),0 18px 50px rgba(82,41,197,.38);
  --success:#4fd0a4;
  --danger:#ff5f7d;
  --warning:#ffbc63;
  --shadow:0 22px 60px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{
  margin:0;
  font-family:"Segoe UI","Malgun Gothic",Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 20% 0%,rgba(122,77,255,.2),transparent 26%),
    radial-gradient(circle at 85% 12%,rgba(65,94,255,.18),transparent 24%),
    linear-gradient(180deg,#05060b 0%,#090b13 48%,#0b0d16 100%);
}
main{width:min(1320px,calc(100% - 24px));max-width:100%;margin:auto;padding:28px 0 110px}
h1{font-size:clamp(34px,5vw,62px);line-height:1.02;margin:10px 0 10px;color:#fff}
h2,h3,h4{color:#fff}
p{margin:0}
a{color:var(--text-soft);text-decoration:none;font-weight:700}
a:hover{color:#fff}
button,input,select,textarea{font:inherit}
input,select,textarea{
  width:100%;
  border:1px solid var(--line-strong);
  border-radius:16px;
  padding:12px 14px;
  background:rgba(10,13,24,.82);
  color:var(--text);
  outline:none;
}
input::placeholder,textarea::placeholder{color:var(--text-muted)}
input:focus,select:focus,textarea:focus{
  border-color:rgba(122,77,255,.72);
  box-shadow:0 0 0 3px rgba(122,77,255,.16);
}
.top,.toolbar{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.top{margin-bottom:22px}
.toolbar{margin-bottom:16px;align-items:center}
.top>*,.toolbar>*{min-width:0}
.brand-lockup{display:flex;align-items:center;gap:12px}
.brand-logo{
  display:block;
  width:48px;
  height:48px;
  object-fit:contain;
  filter:drop-shadow(0 0 24px rgba(122,77,255,.26));
}
.eyebrow{
  color:var(--brand-strong);
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.12em;
  font-size:13px;
}
.muted{color:var(--text-muted)}
.hero-card,.panel,section,aside,.login,.batch-card,.modal,.public-orders{
  background:linear-gradient(180deg,rgba(18,24,42,.94) 0%,rgba(12,16,28,.96) 100%);
  border:1px solid var(--line);
  border-radius:28px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(12px);
}
.hero-card{
  display:grid;
  grid-template-columns:minmax(0,1.15fr) minmax(220px,360px);
  gap:18px;
  padding:22px;
  margin-bottom:20px;
  position:relative;
  overflow:hidden;
}
.hero-card::before{
  content:"";
  position:absolute;
  inset:auto -8% -35% auto;
  width:320px;
  height:320px;
  background:radial-gradient(circle,rgba(122,77,255,.42) 0%,rgba(122,77,255,.1) 36%,transparent 70%);
  pointer-events:none;
}
.hero-content{display:grid;gap:14px;align-content:start;position:relative;z-index:1}
.hero-content h2{margin:0;font-size:clamp(24px,4vw,42px);line-height:1.12}
.hero-copy{color:var(--text-soft);line-height:1.6}
.hero-pills{display:flex;gap:8px;flex-wrap:wrap}
.hero-pills span,.stat,.badge,.menu-section-count{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:999px;
  border:1px solid rgba(122,77,255,.24);
  background:rgba(122,77,255,.12);
  color:#efeaff;
  font-weight:800;
}
.hero-pills span{padding:8px 12px;font-size:12px}
.hero-action{display:inline-flex;align-items:center;gap:8px}
.hero-media{
  min-height:230px;
  border-radius:24px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at center,rgba(122,77,255,.45) 0%,rgba(122,77,255,.16) 26%,transparent 58%),
    linear-gradient(180deg,rgba(12,14,27,.34) 0%,rgba(5,6,11,.96) 100%);
  display:grid;
  place-items:center;
}
.hero-media::after{
  content:"";
  position:absolute;
  left:14%;
  right:14%;
  bottom:16px;
  height:28px;
  border-radius:999px;
  background:radial-gradient(circle,rgba(122,77,255,.3),transparent 72%);
  filter:blur(12px);
}
.hero-media img{
  max-width:min(74%,250px);
  max-height:250px;
  object-fit:contain;
  position:relative;
  z-index:1;
  filter:drop-shadow(0 18px 40px rgba(0,0,0,.45));
}
.primary,.secondary,.danger,.soft-action{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:46px;
  border:0;
  border-radius:16px;
  font-weight:900;
  cursor:pointer;
  padding:0 18px;
  transition:transform .16s ease, box-shadow .16s ease, opacity .16s ease;
}
.primary{
  background:linear-gradient(135deg,#6a3fff 0%,#8b5dff 100%);
  color:#fff;
  box-shadow:var(--brand-glow);
}
.secondary{
  background:rgba(255,255,255,.04);
  color:#fff;
  border:1px solid var(--line-strong);
}
.danger{
  background:rgba(255,95,125,.14);
  color:#ffdce4;
  border:1px solid rgba(255,95,125,.22);
}
.soft-action{
  min-height:42px;
  background:rgba(255,255,255,.04);
  color:var(--text-soft);
  border:1px solid var(--line);
}
.primary:hover,.secondary:hover,.danger:hover,.soft-action:hover{transform:translateY(-1px)}
.message,.empty{
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  color:var(--text-soft);
  font-weight:700;
}
.empty{text-align:center;color:var(--text-muted)}
.grid{display:grid;gap:16px}
.batch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.batch-card{display:grid;gap:12px;padding:20px}
.batch-card h2{margin:0;font-size:24px}
.batch-card p{margin:0}
.badge{width:max-content;padding:7px 12px;font-size:12px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,360px);gap:22px;align-items:start}
.layout>section,.layout>aside{min-width:0}
section,aside{padding:18px}
aside{position:sticky;top:16px}
.tabs{
  display:flex;
  max-width:100%;
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);
  border-radius:20px;
  padding:6px;
  gap:6px;
  overflow:auto;
}
.tabs button,.sizes button{
  border:0;
  border-radius:14px;
  background:transparent;
  padding:11px 15px;
  font-weight:800;
  color:var(--text-muted);
  white-space:nowrap;
}
.tabs button.active,.sizes button.active{
  background:linear-gradient(135deg,rgba(106,63,255,.78) 0%,rgba(139,93,255,.92) 100%);
  color:#fff;
  box-shadow:0 10px 28px rgba(92,54,208,.35);
}
.filters{display:flex;gap:8px;flex:1 1 280px;min-width:0;flex-wrap:wrap}
.filters>*{min-width:0}
.category-strip{display:flex;gap:8px;overflow:auto;padding:2px 2px 10px}
.category-strip button{
  border:1px solid var(--line-strong);
  border-radius:999px;
  background:rgba(255,255,255,.02);
  padding:9px 14px;
  white-space:nowrap;
  font-weight:800;
  color:var(--text-soft);
}
.category-strip button.active{
  background:#fff;
  color:#101427;
  border-color:#fff;
}
.menu-sections{display:grid;gap:14px}
.menu-section{
  display:grid;
  gap:0;
  border:1px solid var(--line);
  border-radius:24px;
  background:rgba(255,255,255,.03);
  overflow:hidden;
}
.menu-section-header{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto auto;
  align-items:center;
  gap:14px;
  padding:18px 20px;
  cursor:pointer;
  list-style:none;
}
.menu-section-header::-webkit-details-marker{display:none}
.menu-section-header h3{margin:0;font-size:24px}
.menu-section-count{min-width:84px;padding:9px 13px;font-size:13px}
.menu-section-count strong{font-size:22px;line-height:1}
.menu-section-toggle{display:inline-flex;align-items:center;justify-content:center;min-width:52px;color:var(--text-muted);font-weight:900;font-size:13px}
.menu-section[open] .menu-section-header{border-bottom:1px solid var(--line)}
.menu-section-body{padding:16px}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{
  overflow:hidden;
  border:1px solid rgba(255,255,255,.06);
  border-radius:22px;
  background:linear-gradient(180deg,rgba(20,25,42,.92) 0%,rgba(12,16,28,.92) 100%);
  box-shadow:0 14px 32px rgba(0,0,0,.24);
}
.card img{
  width:100%;
  aspect-ratio:4/3;
  object-fit:cover;
  display:block;
  background:#101426;
}
.card div{padding:14px}
.card h3{margin:8px 0 12px;font-size:18px;line-height:1.35}
.meta{color:var(--text-muted);font-size:12px}
label{display:grid;gap:6px;margin-bottom:12px}
label span{font-weight:800;font-size:13px;color:var(--text-soft)}
.cart{display:grid;gap:10px}
.cart-item{
  border:1px solid var(--line);
  border-radius:18px;
  padding:13px;
  background:rgba(255,255,255,.03);
}
.cart-item p{margin:5px 0 0;color:#ffc0d2}
.cart-actions{display:grid;grid-template-columns:34px 1fr 34px 34px;gap:6px;margin-top:10px;align-items:center}
.cart-actions button{
  height:34px;
  border:1px solid var(--line);
  border-radius:12px;
  background:rgba(255,255,255,.03);
  color:#fff;
}
.cart-actions span{text-align:center;font-weight:900}
.order-side-header{display:none;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.order-side-header h2,.order-side-title{margin:0}
.close-side{
  display:none;
  width:40px;
  height:40px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.04);
  color:#fff;
  font-weight:900;
}
.cart-toggle,.cart-fab{display:none}
.cart-backdrop{display:none}
.backdrop{position:fixed;inset:0;background:rgba(4,5,11,.76);display:grid;place-items:center;padding:18px}
.modal{
  width:min(520px,100%);
  padding:20px;
  max-height:calc(100vh - 36px);
  overflow:auto;
  position:relative;
}
.modal img{
  width:100%;
  aspect-ratio:16/10;
  object-fit:cover;
  border-radius:22px;
  margin-bottom:14px;
}
.close{
  position:absolute;
  right:24px;
  top:24px;
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  color:#fff;
}
.sizes{
  display:flex;
  gap:6px;
  background:rgba(255,255,255,.03);
  border:1px solid var(--line);
  border-radius:18px;
  padding:6px;
  margin:12px 0;
}
.login{width:min(460px,calc(100% - 32px));margin:18vh auto;padding:22px}
.table-wrap{overflow:auto}
table{width:100%;min-width:760px;border-collapse:collapse}
th,td{border-bottom:1px solid var(--line);padding:12px 10px;text-align:left;vertical-align:top}
th{font-size:13px;color:var(--text-soft)}
.order{
  border:1px solid var(--line);
  border-radius:22px;
  padding:14px;
  margin-bottom:10px;
  background:rgba(255,255,255,.03);
}
.order header{display:flex;justify-content:space-between;gap:10px}
.order ul{padding-left:18px;margin:10px 0 0}
.order em{display:block;color:#ffc0d2;font-style:normal}
.admin-grid{display:grid;grid-template-columns:360px 1fr;gap:18px;align-items:start}
.toolbar-actions{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.toolbar-actions .soft-action,.toolbar-actions .secondary,.toolbar-actions .primary{min-width:unset;padding:0 16px}
.toolbar-actions .csv-action{padding:0 18px}
.public-orders{margin-top:20px;padding:18px}
.public-order-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.public-order{
  border:1px solid var(--line);
  border-radius:22px;
  background:rgba(255,255,255,.03);
  padding:14px;
}
.public-order.mine{
  border-color:rgba(122,77,255,.52);
  box-shadow:0 0 0 1px rgba(122,77,255,.24),0 18px 32px rgba(63,26,164,.16);
}
.public-order h3{margin:0 0 6px}
.public-order ul{margin:8px 0 0;padding-left:18px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.stat{padding:9px 12px}
.selected-batch{
  border-color:rgba(122,77,255,.52);
  box-shadow:0 0 0 1px rgba(122,77,255,.24),0 18px 36px rgba(71,35,178,.16);
}
.selected-note{
  border-radius:18px;
  background:rgba(122,77,255,.14);
  color:#f0ebff;
  padding:13px;
  margin:0 0 12px;
  font-weight:800;
  border:1px solid rgba(122,77,255,.28);
}
.summary-groups{display:grid;gap:12px}
.summary-group{
  border:1px solid var(--line);
  border-radius:22px;
  background:rgba(255,255,255,.03);
  overflow:hidden;
}
.summary-group-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:14px 16px;
  background:rgba(122,77,255,.12);
  border-bottom:1px solid rgba(122,77,255,.16);
}
.summary-group-header h4{margin:0;font-size:16px;color:#fff}
.summary-group-count{font-size:12px;font-weight:900;color:var(--text-soft)}
.summary-list{display:grid}
.summary-row{
  display:grid;
  grid-template-columns:minmax(0,1.6fr) auto auto minmax(0,1.2fr);
  gap:10px;
  align-items:start;
  padding:13px 16px;
  border-top:1px solid var(--line);
}
.summary-row:first-child{border-top:0}
.summary-menu{font-weight:800;line-height:1.35}
.summary-size,.summary-qty{font-weight:800;color:#e2d8ff;white-space:nowrap}
.summary-request{color:var(--text-muted);line-height:1.45;word-break:break-word}
.summary-request.is-empty{color:#69708d}
hr{border:0;border-top:1px solid var(--line);margin:10px 0 8px}
@media(max-width:1200px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside{
    position:fixed;
    top:0;
    right:0;
    bottom:0;
    width:min(420px,100vw);
    height:100dvh;
    z-index:50;
    border-radius:0;
    transform:translateX(100%);
    transition:transform .24s ease;
    overflow:auto;
    padding:18px 16px 28px;
  }
  .layout.side-open aside{transform:translateX(0)}
  .order-side-header,.close-side,.cart-toggle,.cart-fab,.cart-backdrop{display:flex}
  .order-side-title{display:none}
  .cart-toggle,.cart-fab{align-items:center;justify-content:center}
  .cart-backdrop{
    position:fixed;
    inset:0;
    background:rgba(4,5,11,.62);
    z-index:40;
    opacity:0;
    pointer-events:none;
    transition:opacity .24s ease;
  }
  .layout.side-open + .cart-backdrop{opacity:1;pointer-events:auto}
  .cart-fab{
    position:fixed;
    right:16px;
    bottom:16px;
    z-index:41;
    min-height:50px;
    padding:0 18px;
    box-shadow:var(--brand-glow);
  }
}
@media(max-width:900px){
  main{width:min(100%,calc(100% - 16px));padding:18px 0 94px}
  .top{gap:10px;margin-bottom:18px}
  .hero-card{grid-template-columns:1fr;padding:18px}
  .hero-media{min-height:220px}
  .toolbar{
    display:grid;
    grid-template-columns:1fr;
    justify-content:stretch;
    gap:8px;
    margin-bottom:8px;
  }
  .filters,.top,.order header{flex-direction:column}
  .toolbar label,.toolbar button{width:100%}
  .menu-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
  .public-order-grid{grid-template-columns:1fr}
  .admin-grid{grid-template-columns:1fr}
  .menu-section-header{
    grid-template-columns:minmax(0,1fr) auto;
    grid-template-areas:"title title" "count toggle";
    align-items:end;
  }
  .menu-section-header h3{grid-area:title}
  .menu-section-count{grid-area:count;justify-self:start;min-width:unset}
  .menu-section-toggle{grid-area:toggle;justify-self:end}
  .toolbar-actions{width:100%}
  .toolbar-actions .soft-action,.toolbar-actions .secondary,.toolbar-actions .primary{width:100%}
  .summary-row{grid-template-columns:minmax(0,1.35fr) auto auto minmax(0,1fr);gap:8px;padding:12px 14px}
}
@media(max-width:640px){
  main{padding-top:12px}
  h1{font-size:clamp(30px,10vw,48px);margin-top:4px}
  .brand-logo{width:40px;height:40px}
  .hero-card{margin-bottom:16px;border-radius:24px}
  .hero-content h2{font-size:32px}
  .hero-copy{font-size:14px}
  section,aside,.panel,.public-orders{padding:14px;border-radius:22px}
  .tabs,.category-strip{margin-right:-2px;padding-right:2px}
  .tabs{padding:4px}
  .filters{gap:4px;flex:none}
  .toolbar{gap:6px;margin-bottom:6px}
  .toolbar label{margin-bottom:0}
  .cart-toggle{margin:0;min-height:46px;width:100%;align-self:stretch}
  .menu-sections{gap:10px}
  .menu-section{border-radius:20px}
  .menu-section-header{padding:16px}
  .menu-section-body{padding:12px}
  .menu-grid{grid-template-columns:1fr;gap:8px}
  .card{
    display:grid;
    grid-template-columns:90px minmax(0,1fr);
    align-items:stretch;
    border-radius:18px;
  }
  .card img{width:90px;height:90px;aspect-ratio:1;object-fit:cover}
  .card div{
    display:grid;
    gap:6px;
    align-content:center;
    padding:10px 10px 10px 12px;
    min-width:0;
  }
  .card h3{
    margin:0;
    font-size:15px;
    line-height:1.35;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .meta{
    font-size:11px;
    line-height:1.35;
    display:-webkit-box;
    -webkit-line-clamp:1;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .card .secondary{justify-self:start;min-height:34px;padding:0 12px;font-size:13px}
  .public-orders{padding:14px}
  .stat{flex:1 1 120px;text-align:center}
  .summary-group-header{padding:12px 14px}
  .summary-group-header h4{font-size:15px}
  .summary-row{
    grid-template-columns:minmax(0,1fr) auto auto;
    grid-template-areas:"menu size qty" "request request request";
    gap:6px;
    padding:10px 14px;
  }
  .summary-menu{grid-area:menu}
  .summary-size{grid-area:size}
  .summary-qty{grid-area:qty}
  .summary-request{grid-area:request;font-size:12px}
}
</style>
